name: 'Setup Build Environment'
description: 'Standardize environment setup across workflows for multiple tech stacks'
author: 'Demo'

inputs:
  stack-type:
    description: 'Technology stack (node, python, java, dotnet)'
    required: true
  stack-version:
    description: 'Version to install (e.g., 20, 3.11, 17, 8.0)'
    required: true
  enable-cache:
    description: 'Enable dependency caching'
    required: false
    default: 'true'
  cache-key-prefix:
    description: 'Custom cache key prefix'
    required: false
    default: 'deps'

outputs:
  cache-hit:
    description: 'Whether cache was hit'
    value: ${{ steps.cache-deps.outputs.cache-hit }}
  tool-version:
    description: 'Installed tool version'
    value: ${{ steps.setup-info.outputs.version }}

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      if: inputs.stack-type == 'node'
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.stack-version }}

    - name: Cache Node.js dependencies
      if: inputs.stack-type == 'node' && inputs.enable-cache == 'true'
      id: cache-deps
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ inputs.cache-key-prefix }}-node-${{ inputs.stack-version }}-${{ runner.os }}-${{ hashFiles('**/package-lock.json', '**/package.json') }}
        restore-keys: |
          ${{ inputs.cache-key-prefix }}-node-${{ inputs.stack-version }}-${{ runner.os }}-

    - name: Setup Python
      if: inputs.stack-type == 'python'
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.stack-version }}

    - name: Cache Python dependencies
      if: inputs.stack-type == 'python' && inputs.enable-cache == 'true'
      id: cache-python-deps
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ inputs.cache-key-prefix }}-python-${{ inputs.stack-version }}-${{ runner.os }}-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') }}
        restore-keys: |
          ${{ inputs.cache-key-prefix }}-python-${{ inputs.stack-version }}-${{ runner.os }}-

    - name: Setup Java
      if: inputs.stack-type == 'java'
      uses: actions/setup-java@v4
      with:
        java-version: ${{ inputs.stack-version }}
        distribution: 'temurin'

    - name: Cache Maven dependencies
      if: inputs.stack-type == 'java' && inputs.enable-cache == 'true'
      id: cache-maven-deps
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ inputs.cache-key-prefix }}-maven-${{ inputs.stack-version }}-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ inputs.cache-key-prefix }}-maven-${{ inputs.stack-version }}-${{ runner.os }}-

    - name: Setup .NET
      if: inputs.stack-type == 'dotnet'
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ inputs.stack-version }}

    - name: Cache NuGet packages
      if: inputs.stack-type == 'dotnet' && inputs.enable-cache == 'true'
      id: cache-nuget-deps
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ inputs.cache-key-prefix }}-nuget-${{ inputs.stack-version }}-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ inputs.cache-key-prefix }}-nuget-${{ inputs.stack-version }}-${{ runner.os }}-

    - name: Print environment diagnostics
      id: setup-info
      shell: bash
      run: |
        echo "=== Environment Setup Diagnostics ==="
        echo "Stack Type: ${{ inputs.stack-type }}"
        echo "Requested Version: ${{ inputs.stack-version }}"
        echo "Cache Enabled: ${{ inputs.enable-cache }}"
        echo ""
        
        case "${{ inputs.stack-type }}" in
          node)
            echo "Node.js version:"
            node --version
            echo "npm version:"
            npm --version
            echo "version=$(node --version)" >> $GITHUB_OUTPUT
            ;;
          python)
            echo "Python version:"
            python --version
            echo "pip version:"
            pip --version
            echo "version=$(python --version)" >> $GITHUB_OUTPUT
            ;;
          java)
            echo "Java version:"
            java -version
            echo "Maven version:"
            mvn --version
            echo "version=$(java -version 2>&1 | head -n 1)" >> $GITHUB_OUTPUT
            ;;
          dotnet)
            echo ".NET version:"
            dotnet --version
            echo "version=$(dotnet --version)" >> $GITHUB_OUTPUT
            ;;
        esac
        
        echo ""
        echo "Runner OS: ${{ runner.os }}"
        echo "Runner Arch: ${{ runner.arch }}"
