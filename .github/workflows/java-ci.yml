name: Java CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/java-app/**'
      - '.github/workflows/java-ci.yml'
      - '.github/actions/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/java-app/**'
      - '.github/workflows/java-ci.yml'
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  WORKING_DIR: 'apps/java-app'

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: ./.github/actions/setup-build-env
        with:
          stack-type: 'java'
          stack-version: ${{ env.JAVA_VERSION }}

      - name: Run Checkstyle
        working-directory: ${{ env.WORKING_DIR }}
        run: mvn checkstyle:check

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: ./.github/actions/setup-build-env
        with:
          stack-type: 'java'
          stack-version: ${{ env.JAVA_VERSION }}

      - name: Build with Maven
        working-directory: ${{ env.WORKING_DIR }}
        run: mvn clean package -DskipTests

      - name: Upload build artifacts
        uses: ./.github/actions/package-artifacts
        with:
          artifact-name: java-build
          working-directory: ${{ env.WORKING_DIR }}
          retention-days: 7

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: ./.github/actions/setup-build-env
        with:
          stack-type: 'java'
          stack-version: ${{ env.JAVA_VERSION }}

      - name: Run tests with coverage
        working-directory: ${{ env.WORKING_DIR }}
        run: mvn test jacoco:report

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: java-test-results
          path: ${{ env.WORKING_DIR }}/target/surefire-reports
          retention-days: 7

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: java-coverage
          path: ${{ env.WORKING_DIR }}/target/site/jacoco
          retention-days: 7

  security-scan:
    name: Security Scan
    uses: mastercard-actions-demo/github-actions-demo/.github/workflows/reusable-security-scan.yml@main
    with:
      language: 'java'
      scan-type: 'all'
      working-directory: 'apps/java-app'
    permissions:
      contents: read
      security-events: write
      actions: read
