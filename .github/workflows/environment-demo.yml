name: Environment Demo

# This workflow demonstrates environment usage with protection rules
# and environment-specific variables and secrets

on:
  workflow_dispatch:
    inputs:
      application:
        description: 'Application to deploy'
        required: true
        type: choice
        options:
          - nodejs-api
          - python-service
          - java-app
          - dotnet-api
      target-environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - development
          - staging
          - production

permissions:
  contents: read
  deployments: write

jobs:
  build:
    name: Build Application
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine stack type
        id: stack
        run: |
          case "${{ inputs.application }}" in
            nodejs-api)
              echo "type=node" >> $GITHUB_OUTPUT
              echo "version=20" >> $GITHUB_OUTPUT
              echo "path=apps/nodejs-api" >> $GITHUB_OUTPUT
              ;;
            python-service)
              echo "type=python" >> $GITHUB_OUTPUT
              echo "version=3.11" >> $GITHUB_OUTPUT
              echo "path=apps/python-service" >> $GITHUB_OUTPUT
              ;;
            java-app)
              echo "type=java" >> $GITHUB_OUTPUT
              echo "version=17" >> $GITHUB_OUTPUT
              echo "path=apps/java-app" >> $GITHUB_OUTPUT
              ;;
            dotnet-api)
              echo "type=dotnet" >> $GITHUB_OUTPUT
              echo "version=8.0" >> $GITHUB_OUTPUT
              echo "path=apps/dotnet-api" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Build application
        uses: ./.github/workflows/reusable/build-test.yml
        with:
          working-directory: ${{ steps.stack.outputs.path }}
          stack-type: ${{ steps.stack.outputs.type }}
          stack-version: ${{ steps.stack.outputs.version }}
          upload-artifacts: true
          artifact-name: ${{ inputs.application }}-${{ github.run_number }}

  deploy-development:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: build
    if: inputs.target-environment == 'development' || inputs.target-environment == 'staging' || inputs.target-environment == 'production'
    environment:
      name: development
      url: https://dev-${{ inputs.application }}.example.com
    
    steps:
      - name: Deploy to Development
        run: |
          echo "🚀 Deploying ${{ inputs.application }} to Development"
          echo "Environment: development"
          echo "URL: https://dev-${{ inputs.application }}.example.com"
          echo ""
          echo "Environment Variables:"
          echo "- Log Level: debug"
          echo "- Environment Name: development"
          echo ""
          echo "✅ Deployment to Development completed!"

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build, deploy-development]
    if: inputs.target-environment == 'staging' || inputs.target-environment == 'production'
    environment:
      name: staging
      url: https://staging-${{ inputs.application }}.example.com
    
    steps:
      - name: Deploy to Staging
        run: |
          echo "🚀 Deploying ${{ inputs.application }} to Staging"
          echo "Environment: staging"
          echo "URL: https://staging-${{ inputs.application }}.example.com"
          echo ""
          echo "⏸️  Waiting for required reviewers..."
          echo "⏰ 5-minute wait timer active"
          echo ""
          echo "Environment Variables:"
          echo "- Log Level: info"
          echo "- Environment Name: staging"
          echo ""
          echo "✅ Deployment to Staging completed!"

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, deploy-staging]
    if: inputs.target-environment == 'production'
    environment:
      name: production
      url: https://${{ inputs.application }}.example.com
    
    steps:
      - name: Deploy to Production
        run: |
          echo "🚀 Deploying ${{ inputs.application }} to Production"
          echo "Environment: production"
          echo "URL: https://${{ inputs.application }}.example.com"
          echo ""
          echo "🔒 Production deployment requires:"
          echo "- 2 required reviewers"
          echo "- Deployment from main branch only"
          echo ""
          echo "Environment Variables:"
          echo "- Log Level: warn"
          echo "- Environment Name: production"
          echo ""
          echo "✅ Deployment to Production completed!"

  deployment-summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [deploy-development, deploy-staging, deploy-production]
    if: always()
    
    steps:
      - name: Generate deployment summary
        run: |
          echo "## Deployment Summary 🎯" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Application**: ${{ inputs.application }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Environment**: ${{ inputs.target-environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Number**: ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deployment Progress" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.deploy-development.result }}" == "success" ]; then
            echo "- ✅ Development" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ⏭️ Development (skipped)" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.deploy-staging.result }}" == "success" ]; then
            echo "- ✅ Staging" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ⏭️ Staging (skipped)" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.deploy-production.result }}" == "success" ]; then
            echo "- ✅ Production" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ⏭️ Production (skipped)" >> $GITHUB_STEP_SUMMARY
          fi
