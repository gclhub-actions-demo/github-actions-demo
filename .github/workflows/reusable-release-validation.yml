name: 'Reusable: Release Validation'

on:
  workflow_call:
    inputs:
      version:
        description: 'Release version (e.g., 1.2.3)'
        required: true
        type: string
      environment:
        description: 'Target environment (dev, staging, prod)'
        required: true
        type: string
      require-approval:
        description: 'Require manual approval'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate-version:
    name: Validate Version
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate semantic version
        run: |
          VERSION="${{ inputs.version }}"
          
          # Check semantic version format (X.Y.Z)
          if [[ ! $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Invalid version format: $VERSION"
            echo "Expected format: X.Y.Z (e.g., 1.2.3)"
            exit 1
          fi
          
          echo "✅ Valid semantic version: $VERSION"

      - name: Check tag existence
        run: |
          VERSION="${{ inputs.version }}"
          TAG="v$VERSION"
          
          # Check if tag already exists
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "⚠️ Tag $TAG already exists"
            exit 1
          fi
          
          echo "✅ Tag $TAG is available"

  validate-environment:
    name: Validate Environment
    runs-on: ubuntu-latest
    needs: validate-version
    
    steps:
      - name: Validate environment name
        run: |
          ENV="${{ inputs.environment }}"
          
          # Check valid environment
          if [[ ! "$ENV" =~ ^(dev|development|staging|prod|production)$ ]]; then
            echo "❌ Invalid environment: $ENV"
            echo "Valid environments: dev, development, staging, prod, production"
            exit 1
          fi
          
          echo "✅ Valid environment: $ENV"

      - name: Apply environment-specific rules
        run: |
          ENV="${{ inputs.environment }}"
          
          case $ENV in
            prod|production)
              echo "🔒 Production environment - applying strict rules"
              echo "- Requires approval: ${{ inputs.require-approval }}"
              echo "- Additional validation required"
              ;;
            staging)
              echo "🔧 Staging environment - standard validation"
              ;;
            dev|development)
              echo "🚀 Development environment - minimal validation"
              ;;
          esac

  validate-changelog:
    name: Validate Changelog
    runs-on: ubuntu-latest
    needs: validate-version
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check CHANGELOG.md exists
        run: |
          if [ ! -f "CHANGELOG.md" ]; then
            echo "⚠️ CHANGELOG.md not found (warning only)"
            exit 0
          fi
          
          echo "✅ CHANGELOG.md found"

      - name: Verify version in changelog
        run: |
          VERSION="${{ inputs.version }}"
          
          if [ -f "CHANGELOG.md" ]; then
            if grep -q "\[$VERSION\]" CHANGELOG.md; then
              echo "✅ Version $VERSION found in CHANGELOG.md"
            else
              echo "⚠️ Version $VERSION not found in CHANGELOG.md (warning only)"
            fi
          fi

  approval-gate:
    name: Manual Approval
    runs-on: ubuntu-latest
    needs: [validate-version, validate-environment, validate-changelog]
    if: inputs.require-approval == true
    environment: ${{ inputs.environment }}
    
    steps:
      - name: Approval required
        run: |
          echo "⏸️ Manual approval required for:"
          echo "- Version: ${{ inputs.version }}"
          echo "- Environment: ${{ inputs.environment }}"
          echo ""
          echo "This step will wait for approval from authorized reviewers."

  validation-summary:
    name: Validation Summary
    runs-on: ubuntu-latest
    needs: [validate-version, validate-environment, validate-changelog]
    if: always()
    
    steps:
      - name: Generate summary
        run: |
          echo "## Release Validation Summary 🎯" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ inputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Approval Required**: ${{ inputs.require-approval }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Validation Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Version format validated" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Environment validated" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Changelog checked" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All validations passed! Ready for release." >> $GITHUB_STEP_SUMMARY
